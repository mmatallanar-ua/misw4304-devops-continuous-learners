AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Integración continua del microservicio de lista negra (Entrega 2):
  GitHub (CodeConnections) -> CodePipeline V2 -> CodeBuild -> imagen Docker en ECR
  y Dockerrun.aws.json como artefacto en S3. Sin etapa de despliegue.
  Ver docs/adr/0002, docs/adr/0003 y docs/adr/0004.

# Todos los nombres físicos derivan del nombre del stack para que varias copias
# convivan en la misma cuenta. El nombre del stack debe tener como máximo 29
# caracteres porque el nombre de la conexión admite 32 (se le agrega "-gh").

Parameters:
  GitHubOwner:
    Type: String
    Default: mmatallanar-ua
    Description: Usuario u organización dueña del repositorio en GitHub.
  RepoName:
    Type: String
    Default: misw4304-devops-continuous-learners
    Description: Nombre del repositorio en GitHub.
  BranchName:
    Type: String
    Default: main
    Description: Rama cuyos push disparan el pipeline.
  CodeBuildImage:
    Type: String
    Default: aws/codebuild/standard:7.0
    Description: >-
      Imagen de CodeBuild. Trae Docker y Python 3.13 (la versión del buildspec
      y del Dockerfile); es la que se probó de punta a punta.

Resources:
  # ---------------------------------------------------------------------------
  # Conexión con GitHub. Nace en estado PENDING: un admin del repo debe
  # aprobarla una vez desde la consola (ver infra/README.md).
  # ---------------------------------------------------------------------------
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: !Sub "${AWS::StackName}-gh"
      ProviderType: GitHub

  # ---------------------------------------------------------------------------
  # Artifact store del pipeline. Hay que vaciarlo antes de borrar el stack.
  # ---------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expirar-artefactos
            Status: Enabled
            ExpirationInDays: 30

  # ---------------------------------------------------------------------------
  # Repositorio de imágenes. Tags mutables porque el buildspec empuja :<sha> y
  # :latest, y relanzar el pipeline sobre el mismo commit no debe fallar.
  # EmptyOnDelete permite que delete-stack lo borre aunque tenga imágenes.
  # ---------------------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Conservar las ultimas 10 imagenes","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${AWS::StackName}-build"
      RetentionInDays: 14

  # ---------------------------------------------------------------------------
  # Grupo de reportes de pytest. El buildspec usa `reports: pytest:` y CodeBuild
  # nombra ese grupo "<proyecto>-pytest"; al declararlo con ese nombre exacto,
  # CodeBuild lo reutiliza en vez de crear uno fuera del stack, y delete-stack
  # lo borra con el resto. El nombre del proyecto es "<stack>-build".
  # ---------------------------------------------------------------------------
  TestReportGroup:
    Type: AWS::CodeBuild::ReportGroup
    Properties:
      Name: !Sub "${AWS::StackName}-build-pytest"
      Type: TEST
      DeleteReports: true
      ExportConfig:
        ExportConfigType: NO_EXPORT

  # ---------------------------------------------------------------------------
  # IAM con mínimo privilegio: cada rol solo toca los recursos de este stack.
  # ---------------------------------------------------------------------------
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: codebuild-ci
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt BuildLogGroup.Arn
                  - !Sub "${BuildLogGroup.Arn}:*"
              - Sid: Artefactos
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: Bucket
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: Reportes
                Effect: Allow
                Action:
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                Resource: !GetAtt TestReportGroup.Arn
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt EcrRepository.Arn

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: codepipeline-ci
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artefactos
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: Bucket
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
              # Las conexiones nuevas tienen ARN codeconnections; se incluyen
              # ambos prefijos de acción por compatibilidad.
              - Sid: ConexionGitHub
                Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection
              - Sid: Build
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BuildProject.Arn

  # ---------------------------------------------------------------------------
  # Build: usa el buildspec.yml de la raíz del repo (HU-E2.3).
  # ---------------------------------------------------------------------------
  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${AWS::StackName}-build"
      Description: Pruebas, imagen Docker en ECR y Dockerrun.aws.json como artefacto (sin despliegue).
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: !Ref CodeBuildImage
        # Necesario para `docker build` dentro de CodeBuild.
        PrivilegedMode: true
        EnvironmentVariables:
          # Las lee el buildspec para armar la URI de la imagen.
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: IMAGE_REPO_NAME
            Value: !Ref EcrRepository
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      TimeoutInMinutes: 15

  # ---------------------------------------------------------------------------
  # Pipeline V2: Source -> Build. El trigger de push filtrado por rama es lo
  # que hace que cada commit a BranchName lo dispare sin intervención manual.
  # ---------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline"
      PipelineType: V2
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              Namespace: SourceVariables
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: !Sub "${GitHubOwner}/${RepoName}"
                BranchName: !Ref BranchName
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches:
                  Includes:
                    - !Ref BranchName

Outputs:
  ConnectionArn:
    Description: Conexión con GitHub; queda PENDING hasta aprobarla.
    Value: !Ref GitHubConnection
  ConnectionApprovalUrl:
    Description: Página de la consola donde se aprueba la conexión.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/settings/connections?region=${AWS::Region}"
  ArtifactBucketName:
    Description: Bucket donde queda el Dockerrun.aws.json (<pipeline>/BuildArtif/<id>).
    Value: !Ref ArtifactBucket
  PipelineUrl:
    Description: Pipeline en la consola.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
  BuildProjectName:
    Value: !Ref BuildProject
  EcrRepositoryUri:
    Description: Repositorio donde el build publica la imagen (:<sha> y :latest).
    Value: !GetAtt EcrRepository.RepositoryUri
  TestReportGroupArn:
    Value: !GetAtt TestReportGroup.Arn
