# PostgreSQL local para probar la app contra el mismo motor que usa RDS.
#   docker compose up -d
#   export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/blacklist
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blacklist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacklist"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
